<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('商品')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>商品列表</h1>
    <div class="info" data-testid="message" th:if="${message}" th:text="${message}"></div>
    <table>
        <thead>
        <tr><th>商品</th><th>单价</th><th>库存</th><th>数量</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}">笔记本</td>
            <td th:text="'¥' + ${#numbers.formatDecimal(p.price, 1, 2)}">¥50.00</td>
            <td th:text="${store.getStock(p.id)}">100</td>
            <td colspan="2">
                <form method="post" action="/products" class="inline">
                    <input type="hidden" name="productId" th:value="${p.id}"/>
                    <input type="number" name="quantity" value="1" min="1" max="99" aria-label="数量"/>
                    <button type="submit">加入购物车</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
