name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 单元测试与 API 测试
        working-directory: java
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java/target/surefire-reports/

  e2e:
    needs: unit-and-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 后台启动网站
        working-directory: java
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run > /tmp/app.log 2>&1 &

      - name: 等待网站就绪
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && break
            sleep 2
          done

      - name: 安装 Playwright 浏览器
        working-directory: java
        run: ./mvnw exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: E2E 测试
        working-directory: java
        run: |
          mkdir -p traces
          ./mvnw -B test -Pe2e

      - name: 失败时上传 Trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: java/traces/